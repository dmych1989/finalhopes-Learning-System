<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文医案查询系统 · 网页版</title>
    <link rel="stylesheet" href="/static/style.css?v=92">

<body>
<div class="app">
  <header class="topbar renji-bar">
    <div class="brand">
      <img class="brand-logo" src="/static/logo.png" alt="论文医案查询系统">
      <div>
        <h1>论文医案查询系统</h1>
      </div>
    </div>
    <div class="searchbox">
      <input id="search" type="text" placeholder="输入关键词（症状 / 中药 / 医案 / 文章…）" autocomplete="off">
      <button id="searchBtn">搜索</button>
    </div>
    <div id="sysInline" class="sys-inline"></div>
  </header>

  <div class="layout">
    <div class="board-tabs" id="boardTabs"></div>
    <main class="main">
      <div class="module-head" id="moduleHead"></div>
      <div class="workarea">

          <aside class="cases-catnav" id="articleCatNav" style="display:none"></aside>
          <div class="list-main" id="listMain">
            <div class="filter-bar" id="filterBar"></div>
            <div class="hint" id="listHint">请选择上方标签，或直接在上方搜索。</div>
            <ul id="resultList" class="result-list"></ul>
            <div class="pager" id="pager"></div>
          </div>
        </section>
        <section class="detail-pane" id="detailPane">
          <div class="hint">点击条目查看详情。</div>
        </section>
      </div>
    </main>
  </div>
  <footer class="site-footer">
